name: Backend, UI and production build

on:
  push:
    branches: [main, feature-sharad, integration-ui-backend]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Lint and test
        run: |
          ruff check backend scripts
          ruff format --check backend scripts
          pytest backend/tests -q
          python scripts/export_openapi.py --check
      - name: Build Python distribution
        run: python -m build backend --outdir dist
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Verify a clean wheel installation
        run: |
          python -m venv /tmp/supplier-wheel
          /tmp/supplier-wheel/bin/python -m pip install --require-hashes -r backend/requirements.lock
          /tmp/supplier-wheel/bin/python -m pip install --no-deps dist/*.whl
          python scripts/production_smoke.py --python /tmp/supplier-wheel/bin/python --require-installed
      - name: Browser integration checks
        run: |
          cd frontend
          npx playwright install --with-deps chromium --only-shell
          npm run test:e2e
      - name: Build and smoke-test production container
        run: |
          docker build -t supplier-risk-ci .
          docker run --rm --entrypoint python supplier-risk-ci /app/scripts/production_smoke.py --python /usr/local/bin/python --app-root /app --require-installed
