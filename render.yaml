services:
  - type: web
    name: supplier-risk-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/GeekNandy/Supplier-Risk-Intelligence
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 130
    envVars:
      - key: PORT
        value: "10000"
      - key: LLM_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: LLM_MODEL
        value: nvidia/Nemotron-3.5-Super-VL
      - key: LLM_EXTRA_BODY
        value: '{"chat_template_kwargs":{"enable_thinking":false}}'
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JURY_USERNAME
        value: jury
      - key: JURY_PASSWORD
        sync: false
      - key: REQUIRE_JURY_AUTH
        value: "true"
      - key: REQUIRE_LIVE_AI
        value: "true"
